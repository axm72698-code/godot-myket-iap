name: Build Myket Billing Godot Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Android AAR
      run: gradle :plugin:assembleRelease

    - name: Upload Plugin AAR
      uses: actions/upload-artifact@v4
      with:
        name: MyketBillingPlugin-Release
        path: plugin/build/outputs/aar/plugin-release.aar
