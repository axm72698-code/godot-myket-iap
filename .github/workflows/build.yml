name: Build Myket Billing Godot Plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    - name: Build Android AAR
      run: gradle :plugin:assembleRelease

    - name: Upload Plugin AAR
      uses: actions/upload-artifact@v4
      with:
        name: godot-myket-iap-release
        path: plugin/build/outputs/aar/*.aar
